name: chat_app
description: Chat App with a local Firebase-like backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local backend (stands in for Firebase Auth / Firestore / Storage)
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  crypto: ^3.0.8

  # Notifications (stands in for Firebase Cloud Messaging)
  flutter_local_notifications: ^22.3.3

  # Image picking
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
